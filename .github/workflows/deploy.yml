name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Patch postcss for Node 18 compatibility
        run: |
          node -e "
          const fs = require('fs');
          const p = './node_modules/postcss-safe-parser/node_modules/postcss/package.json';
          if (fs.existsSync(p)) {
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (pkg.exports) {
              const files = ['at-rule','comment','container','css-syntax-error','declaration','fromJSON','input','lazy-result','list','map-generator','node','parse','parser','postcss','previous-map','processor','result','root','rule','stringifier','stringify','symbols','terminal-highlight','tokenize','warn-once','warning'];
              files.forEach(f => { pkg.exports['./lib/' + f] = './lib/' + f + '.js'; });
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
              console.log('Successfully patched postcss package.json');
            }
          }
          "

      - name: Build production bundle
        run: npm run build
        env:
          NODE_OPTIONS: '--openssl-legacy-provider'
          CI: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
